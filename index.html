<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tik Tac Toe</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
       <!--Game Heading-->
    <p><h1>"Tik TaK Toe"</p>
   <!-- Making a layout for game-->
    <main>
        <div class="container">
            <div class="game">
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
        </div><br>

        <!--To show the winner and to button-->
        <div class="msgcontainer hide">
            <p id="msg">Winner</p>
            <button id="newgame">New Game</button>
        </div>
        <!--To show the player turn-->
        <P class="turn">'X' player turn!</P>
        <!--To show the reset button-->
        <button id="reset">Reset</button>
    </main>
    <h2>"Made by Kushal Parajuli"</h2>
    <script src="script.js"></script>
</body>
</html>
